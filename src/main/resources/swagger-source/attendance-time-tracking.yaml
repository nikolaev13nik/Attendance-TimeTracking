swagger: '2.0'

info:
  title: Attendance Time Tracking
  description: |
    Services for work-time tracking and attendance management.
  version: 1.0.0

consumes:
  - application/json
produces:
  - application/json

tags:
  - name: Time Tracking
    description: Attendance and work-time tracking operations

paths:

  /attendance/openSession/tenant/{tenantId}/userId/{idUser}:
    put:
      summary: Starts a new work-time record for a user
      operationId: openSession
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: idUser
          in: path
          description: |
            Unique identifier of the user
          required: true
          type: integer
          format: int32
        - name: body
          in: body
          description: |
            Session tracking parameters
          required: true
          schema:
            $ref: '#/definitions/SessionDataDto'
      responses:
        '200':
          description: |
            Created time tracking record
          schema:
            $ref: '#/definitions/DataTimeDto'
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/closeSession/tenant/{tenantId}/userId/{idUser}:
    put:
      summary: Finishes an active work-time record for a user
      operationId: closeSession
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: idUser
          in: path
          description: |
            Unique identifier of the user
          required: true
          type: integer
          format: int32
        - name: body
          in: body
          description: |
            Session tracking parameters
          required: true
          schema:
            $ref: '#/definitions/SessionDataDto'
      responses:
        '200':
          description: |
            Finished time tracking record
          schema:
            $ref: '#/definitions/DataTimeDto'
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/sessionChange/tenant/{tenantId}:
    post:
      summary: Edits an existing work-time record
      operationId: editRecord
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: EditDataTimeUserDto
          in: body
          description: |
            Details of the work-time record to edit
          required: true
          schema:
            $ref: '#/definitions/EditDataTimeUserDto'
      responses:
        '200':
          description: |
            Updated time tracking record
          schema:
            $ref: '#/definitions/DataTimeDto'
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/sessions/tenant/{tenantId}:
    get:
      summary: Gets sessions within a date range or-and user id
      operationId: getAllRecordsEmployeeByMonth
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: startDate
          in: query
          description: |
            Start date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: endDate
          in: query
          description: |
            Finish date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: idUser
          in: query
          description: |
            Unique identifier of the user
          required: false
          type: integer
          format: int32
      responses:
        '200':
          description: |
            List of work-time records for the specified range
          schema:
            type: array
            items:
              $ref: '#/definitions/DataTimeDto'
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/workdays/tenant/{tenantId}:
    get:
      summary: Counts total worked days for an employee within a date range
      operationId: getCountWorkedDaysByEmployee
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: openSessionDate
          in: query
          description: |
            Start date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: closeSessionDate
          in: query
          description: |
            Finish date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: idUser
          in: query
          description: |
            Unique identifier of the user
          required: true
          type: integer
          format: int32
      responses:
        '200':
          description: |
            Total number of worked days
          schema:
            type: integer
            format: int64
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/hours/tenant/{tenantId}:
    get:
      summary: Calculates total worked hours for an employee within a date range
      operationId: getAllHoursEmployeeBetweenDates
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: openSessionDate
          in: query
          description: |
            Start date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: closeSessionDate
          in: query
          description: |
            Finish date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: idUser
          in: query
          description: |
            Unique identifier of the user
          required: true
          type: integer
          format: int32
      responses:
        '200':
          description: |
            Total number of worked hours
          schema:
            type: integer
            format: int64
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/overtime/tenant/{tenantId}:
    get:
      summary: Calculates overtime hours for an employee within a date range
      operationId: getOvertimeEmployeeBetweenDates
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: startDate
          in: query
          description: |
            Start date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: endDate
          in: query
          description: |
            Finish date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: idUser
          in: query
          description: |
            Unique identifier of the user
          required: true
          type: integer
          format: int32
      responses:
        '200':
          description: |
            Total number of overtime hours
          schema:
            type: integer
            format: int64
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/check/tenant/{tenantId}/user/{idUser}:
    get:
      summary: Checks and retrieves incomplete (null) records within a date range
      operationId: checkRowsForNull
      tags:
        - Time Tracking
      parameters:
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
        - name: idUser
          in: path
          description: |
            Unique identifier of the user
          required: true
          type: integer
          format: int32
        - name: startDate
          in: query
          description: |
            Start date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
        - name: endDate
          in: query
          description: |
            Finish date of the range (ISO format YYYY-MM-DD)
          required: true
          type: string
          format: date
      responses:
        '200':
          description: |
            List of incomplete work-time records
          schema:
            type: array
            items:
              $ref: '#/definitions/DataTimeDto'
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'

  /attendance/sessionRemove/tenant/{tenantId}/session/{id}:
    delete:
      summary: Removes a work-time record
      operationId: removeRecord
      tags:
        - Time Tracking
      parameters:
        - name: id
          in: path
          description: |
            Unique identifier of the time record to remove
          required: true
          type: integer
          format: int32
        - name: tenantId
          in: path
          description: |
            Unique identifier of the tenant
          required: true
          type: integer
          format: int32
      responses:
        '200':
          description: |
            Removed time tracking record
          schema:
            $ref: '#/definitions/DataTimeDto'
        '400':
          $ref: '#/responses/400-BadRequest'
        '401':
          $ref: '#/responses/401-Unauthorized'
        '403':
          $ref: '#/responses/403-Forbidden'
        '500':
          $ref: '#/responses/500-InternalServerError'


definitions:


  SessionDataDto:
    type: object
    description: |
      Input data required to open or close a work session
    properties:
      openSessionDate:
        description: |
          Moment the session opened
        type: string
        format: date-time
      closeSessionDate:
        description: |
          Moment the session closed
        type: string
        format: date-time
      workDate:
        description: |
          Calendar work date
        type: string
        format: date

  DataTimeDto:
    type: object
    description: |
      A single work-time record
    properties:
      id:
        description: |
          Unique identifier of the record
        type: integer
        format: int32
      userId:
        description: |
          User identifier
        type: integer
        format: int32
      tenantId:
        description: |
          tenant identifier
        type: integer
        format: int32
      workDate:
        description: |
          Calendar day of the record
        type: string
        format: date
      openSessionDate:
        description: |
          Moment the record was started
        type: string
        format: date-time
      closeSessionDate:
        description: |
          Moment the record was finished
        type: string
        format: date-time

  EditDataTimeUserDto:
    type: object
    description: |
      Input for editing a work-time record's start and/or finish
    properties:
      id:
        description: |
          Unique identifier of the record to edit
        type: integer
        format: int32
      openSessionDate:
        description: |
          New start moment
        type: string
        format: date-time
      closeSessionDate:
        description: |
          New finish moment
        type: string
        format: date-time

  ApiError:
    type: object
    description: |
      Standard error payload
    properties:
      status:
        description: |
          HTTP status
        type: string
      error:
        description: |
          Short error description
        type: string
      message:
        description: |
          Human-readable explanation of the error
        type: string
      path:
        description: |
          Request path that produced the error
        type: string


responses:

  400-BadRequest:
    description: |
      Bad Request - the server cannot process the request due to a client error.
    schema:
      $ref: '#/definitions/ApiError'

  401-Unauthorized:
    description: |
      Unauthorized - valid authentication credentials are missing.
    schema:
      $ref: '#/definitions/ApiError'

  403-Forbidden:
    description: |
      Forbidden - the authenticated user is not allowed to perform this operation.
    schema:
      $ref: '#/definitions/ApiError'

  409-Conflict:
    description: |
      Conflict - the request conflicts with the current state of the resource.
    schema:
      $ref: '#/definitions/ApiError'

  500-InternalServerError:
    description: |
      Internal Server Error - an unexpected condition prevented the request from completing.
    schema:
      $ref: '#/definitions/ApiError'