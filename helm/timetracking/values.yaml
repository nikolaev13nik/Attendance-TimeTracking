namespace: attendance

replicaCount: 1

image:
  repository: ghcr.io/nikolaev13nik/attendance-timetracking

  tag: ""

  pullPolicy: IfNotPresent

service:
  port: 8080
  targetPort: 8080

config:
  name: attendance-config
secret:
  name: attendance-secrets

database:
  name: attendance
  schema: timetracking
  username: timetracking_user
  passwordKey: TIMETRACKING_DB_PASSWORD

jwtSecretKey: JWT_SECRET

accountingBaseUrlKey: ATTENDANCE_ACCOUNTING_BASE_URL
kafkaBootstrapServersKey: KAFKA_BOOTSTRAP_SERVERS

connectTimeoutMs: ""
readTimeoutMs: ""

javaToolOptions: "-XX:MaxRAMPercentage=75"

resources:
  requests:
    memory: 512Mi
    cpu: 200m
  limits:
    memory: 1Gi
    cpu: 1000m

strategy:
  maxSurge: 1
  maxUnavailable: 0

probes:
  path: /actuator/health
  startup:
    periodSeconds: 5
    failureThreshold: 48
  readiness:
    periodSeconds: 10
    failureThreshold: 3
  liveness:
    periodSeconds: 30
    failureThreshold: 3
