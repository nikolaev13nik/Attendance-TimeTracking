name: CI

on:
  push:
    branches: [ "main" ]

  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Build, test and check coverage
        run: mvn clean verify -Pci

      - name: Upload JaCoCo coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/

      - name: Generate version
        id: version
        run: |

          git fetch --tags

          # Find latest version created from main
          latest=$(git tag --list '[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -n 1)

          if [ -z "$latest" ]; then
            latest="1.0.0"
          fi

          if [ "${{ github.event_name }}" = "pull_request" ]; then

            # PR version:
            # latest main version + GitHub Actions run number
            version="${latest}-${{ github.run_number }}"

          else

            # Main version:
            # increment patch number
            IFS='.' read -r major minor patch <<< "$latest"

            patch=$((patch + 1))

            version="$major.$minor.$patch"

          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"

          echo "================================="
          echo "Build version: $version"
          echo "================================="

      - name: Create main version tag
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag "${{ steps.version.outputs.version }}"

          git push origin "${{ steps.version.outputs.version }}"