
spring.jpa.show-sql=false

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.h2.console.enabled=true
spring.datasource.driverClassName=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.datasource.url=jdbc:h2:file:./data/att

spring.datasource.username=password
spring.datasource.password=password
management.endpoints.web.exposure.include=health
management.endpoint.shutdown.enabled= true
spring.web.error.include-message=always
att.security.jwt.secret=${ATTENDANCE_ACCOUNTING_JWT_SECRET}
spring.h2.console.settings.web-allow-others=false
att.integration.attendance-accounting.base-url=${ATTENDANCE_ACCOUNTING_BASE_URL:http://localhost:8081}
att.overtime.daily-threshold=${ATT_OVERTIME_DAILY_THRESHOLD:8.0}
spring.config.import=optional:classpath:async-messages.yml

spring.jpa.properties.hibernate.temp.use_jblc_metadata_defaults=false
spring.jackson.datatype.datetime.adjust-dates-to-context-time-zone=false

attendance.security.tenant.path-patterns=/attendance/**
logging.pattern.correlation=[%X{traceId:-}] [user=%X{userId:-} tenant=%X{tenantId:-} target=%X{targetUserId:-}] 
